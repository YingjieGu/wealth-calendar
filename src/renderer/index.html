<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>财神日历</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- ==================== Pet View ==================== -->
    <div id="pet-view">
      <div id="pet-stage">
        <div id="pet" class="theme-cat">
          <span id="pet-emoji">🐱</span>
          <img id="pet-img" style="display:none;" alt="custom pet">
          <video id="pet-video" style="display:none;" loop muted autoplay></video>
          <canvas id="pet-canvas" width="84" height="84" style="display:none;"></canvas>
        <div id="pet-bg" style="display:none;"></div>
        </div>
        <div id="pet-zzz">💤</div>
      </div>

      <!-- Reminder speech bubble -->
      <div id="reminder-bubble" class="hidden">
        <div id="reminder-bubble-text"></div>
      </div>

      <!-- Hover buttons -->
      <div id="hover-buttons">
        <button id="btn-chat" title="对话" class="hover-btn">💬</button>
        <button id="btn-calendar" title="日历" class="hover-btn">📅</button>
        <button id="btn-settings" title="设置" class="hover-btn">⚙️</button>
      </div>

      <!-- Context menu (right-click pet) -->
      <div id="context-menu" class="hidden">
        <button data-action="fortune">🔮 今日运势</button>
        <button data-action="stick">🎋 摇一支签</button>
        <button data-action="calendar">📅 日历</button>
        <button data-action="settings">⚙️ 设置</button>
        <button data-action="hide">🙈 隐藏宠物（Ctrl+Alt+W）</button>
        <button data-action="quit">🚪 退出</button>
      </div>

      <!-- Chat panel -->
      <div id="chat-panel" class="hidden">
        <div class="chat-header">
          <span>💬 和小财聊天</span>
          <button id="btn-close-chat" class="close-btn">✕</button>
        </div>
        <div id="chat-messages">
          <div class="chat-msg chat-assistant">你好呀～我是小财！可以找我聊天、查运势，也可以直接说"明天下午3点开会"帮你记日程哦 ✨</div>
        </div>
        <div class="chat-input-row">
          <button id="btn-chat-mic" class="chat-mic-btn" title="语音输入">🎤</button>
          <input id="chat-input" placeholder="说点什么…（如：明天下午3点开会）" autocomplete="off">
          <button id="btn-chat-send" class="chat-send-btn">➤</button>
        </div>
      </div>

      <!-- Settings panel -->
      <div id="settings-panel" class="hidden">
        <div class="settings-header">
          <span>⚙️ 设置</span>
          <button id="btn-close-settings" class="close-btn">✕</button>
        </div>
        <div class="settings-body">
          <div class="setting-group">
            <label>主题</label>
            <div class="setting-options" id="theme-options">
              <button class="theme-option active" data-theme="cat">🐱 萌宠</button>
              <button class="theme-option" data-theme="fortune">🧧 财神</button>
              <button class="theme-option" data-theme="bagua">☯️ 八卦</button>
              <button class="theme-option" data-theme="custom">🖼️ 自定义</button>
            </div>
            <input type="file" id="pet-upload" accept="image/*" style="display:none;">
            <button id="btn-upload-pet" class="action-btn">📤 上传宠物图片（自定义主题）</button>
          </div>

          <div class="setting-group">
            <label>活跃度</label>
            <div class="setting-options" id="activity-options">
              <button class="activity-option active" data-activity="active">🐾 活跃</button>
              <button class="activity-option" data-activity="quiet">😴 安静</button>
            </div>
          </div>

          <div class="setting-group">
            <button id="btn-restore-position" class="action-btn">📍 恢复默认位置</button>
          </div>

          <div class="setting-group">
            <label>用户信息（命理分析用）</label>
            <input type="datetime-local" id="user-birth" class="setting-input">
            <div class="setting-row">
              <button class="theme-option" data-gender="male" id="gender-male">♂ 男</button>
              <button class="theme-option" data-gender="female" id="gender-female">♀ 女</button>
            </div>
            <p class="placeholder-text" id="user-zodiac">星座：—</p>
            <button id="btn-save-userinfo" class="action-btn">💾 保存用户信息</button>
          </div>

          <div class="setting-group">
            <label>内置宠物素材（透明 PNG，点击应用）</label>
            <div id="pets-grid" class="pets-grid"></div>
          </div>
          <div class="setting-group">
            <label>主求方向（提醒侧重，报告仍全面展示）</label>
            <div class="setting-options" id="wish-options">
              <button class="activity-option" data-wish="wealth">💰 求财</button>
              <button class="activity-option" data-wish="love">💘 求姻缘</button>
              <button class="activity-option" data-wish="career">💼 求事业</button>
              <button class="activity-option" data-wish="health">💪 求健康</button>
              <button class="activity-option" data-wish="study">📚 求学业</button>
              <button class="activity-option" data-wish="peace">🛡️ 求平安</button>
            </div>
            <button id="btn-clear-wish" class="action-btn">✖️ 清除主求（全面提醒）</button>
          </div>

          <div class="setting-group">
            <label>日历模式</label>
            <div class="setting-options" id="calendar-mode-options">
              <button class="activity-option active" data-mode="floating">🪟 悬浮日历</button>
              <button class="activity-option" data-mode="wallpaper">🖼️ 桌面背景</button>
            </div>
            <button id="btn-apply-wallpaper" class="action-btn">🖼️ 立即生成桌面背景日历</button>
            <p class="placeholder-text">桌面背景模式会把今日行程+运势+黄历合成壁纸，每小时自动刷新</p>
          </div>

          <div class="setting-group">
            <label>多模态动图生成（图片 → 动画宠物）</label>
            <select id="mm-provider" class="setting-input">
              <option value="jimeng">即梦 Seedance（火山引擎，有免费额度）</option>
              <option value="kling">可灵 Kling</option>
            </select>
            <select id="mm-auth-type" class="setting-input">
              <option value="aksk">AK/SK 签名（火山引擎 AccessKey）</option>
              <option value="apikey">API Key（Bearer）</option>
            </select>
            <input type="text" id="mm-access-key" class="setting-input" placeholder="AccessKeyId（即梦/火山引擎控制台）">
            <input type="password" id="mm-secret-key" class="setting-input" placeholder="SecretAccessKey">
            <input type="password" id="mm-api-key" class="setting-input" placeholder="API Key（Bearer 方式，可留空）" style="display:none;">
            <input type="file" id="mm-upload" accept="image/*" style="display:none;">
            <button id="btn-mm-upload" class="action-btn">🖼️ 选择图片 → 生成动画宠物</button>
            <button id="btn-mm-clear" class="action-btn">🗑️ 清除动画宠物</button>
            <p class="placeholder-text" id="mm-status">上传一张宠物图片（如小猫照片），AI 会把它变成会动的桌面宠物，生成约 1-3 分钟</p>
          </div>

          <div class="setting-group">
            <label>本地模型状态</label>
            <p class="placeholder-text" id="model-status">检测中…</p>
          </div>
          <div class="setting-group">
            <label>唤醒口令（语音对话用）</label>
            <input type="text" id="wake-word" class="setting-input" placeholder="默认：小财小财">
            <button id="btn-save-wakeword" class="action-btn">💾 保存唤醒口令</button>
          </div>
          <div class="setting-group">
            <label>AI 命理（DeepSeek 兼容 API）</label>
            <input type="password" id="llm-api-key" class="setting-input" placeholder="API Key（留空则用本地模板推算）">
            <input type="text" id="llm-base-url" class="setting-input" placeholder="Base URL（默认 https://api.deepseek.com/v1）">
            <input type="text" id="llm-model" class="setting-input" placeholder="Model（默认 deepseek-chat）">
            <label class="setting-checkbox">
              <input type="checkbox" id="fortune-reminder-enabled" checked> 每日运势提醒
            </label>
            <button id="btn-save-modelconfig" class="action-btn">💾 保存模型配置</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== Calendar View ==================== -->
    <div id="calendar-view" style="display:none;">
      <div class="cal-header">
        <button id="btn-calendar-close" class="close-btn" title="关闭日历">✕</button>
        <button id="btn-prev-month">◀</button>
        <span id="cal-month-label">2026年8月</span>
        <button id="btn-next-month">▶</button>
        <button id="btn-today">今天</button>
      </div>

      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>

      <div id="calendar-grid" class="cal-grid">
        <!-- dynamically filled -->
      </div>

      <!-- Daily fortune section -->
      <div id="fortune-section" class="hidden">
        <div class="fortune-header">
          <span id="fortune-title">✨ 今日运势</span>
          <button id="btn-refresh-fortune" class="fortune-refresh" title="刷新运势">🔄</button>
        </div>
        <div id="fortune-body"><!-- filled by calendar.js --></div>
      </div>

      <!-- Schedule detail panel (bottom) -->
      <div id="schedule-detail" class="hidden">
        <div class="detail-header">
          <span id="detail-date-label">2026-08-04</span>
          <button id="btn-close-detail" class="close-btn">✕</button>
        </div>
        <div id="detail-almanac" class="detail-almanac"></div>
        <div id="schedule-list" class="schedule-list"></div>
        <button id="btn-add-schedule" class="action-btn">＋ 添加日程</button>
      </div>
    </div>

    <!-- ==================== Schedule Form Modal ==================== -->
    <div id="schedule-form-modal" class="hidden">
      <div class="modal-backdrop">
        <div class="modal-content">
          <h3 id="form-title">添加日程</h3>
          <form id="schedule-form">
            <div class="form-group">
              <label>标题 *</label>
              <input type="text" id="form-schedule-title" required placeholder="日程标题">
            </div>
            <div class="form-group">
              <label>日期</label>
              <input type="date" id="form-schedule-date" required>
            </div>
            <div class="form-group">
              <label>时间（可选）</label>
              <input type="time" id="form-schedule-time">
            </div>
            <div class="form-group">
              <label>提前提醒（分钟）</label>
              <input type="number" id="form-schedule-remind" min="0" placeholder="0 = 准时提醒">
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="form-schedule-note" rows="2" placeholder="备注内容"></textarea>
            </div>
            <div class="form-actions">
              <button type="button" id="btn-cancel-form" class="action-btn">取消</button>
              <button type="submit" class="action-btn primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden"></div>
  </div>

  <script src="pet.js"></script>
  <script src="calendar.js"></script>
  <script src="chat.js"></script>
  <script src="settings.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
